<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fffdfa" />
    <meta name="robots" content="noindex" />
    <title>404 — Sunlight</title>
    <style>
      :root {
        color-scheme: light;
        --day: #fffdfa;
        --bounce: #f5d7a6;
        --ink: #8b857b;
        --ink-warm: #7d6046;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 32px;
        background: var(--day)
          linear-gradient(309deg, rgb(245 215 166 / 50%), rgb(245 215 166 / 50%) 20%, transparent);
        color: var(--ink);
        font:
          15px/1.7 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Helvetica,
          Arial,
          sans-serif;
        text-align: center;
      }
      p {
        margin: 0;
      }
      a {
        color: var(--ink-warm);
        text-decoration: none;
        transition: opacity 0.2s ease;
      }
      a:hover {
        opacity: 0.6;
      }
      a:focus-visible {
        outline: 1px solid currentColor;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <p>There is no room here.</p>
    <p><a href="/">Back into the sunlight</a></p>
  </body>
</html>
