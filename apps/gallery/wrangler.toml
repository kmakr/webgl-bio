# gallery.theoazriel.com — the photographs.
#
# Deployed fresh as "theo-gallery"; the old root-domain Worker for this app
# was the auto-named "wild-sun-9904", which can be deleted once this one is
# live and theoazriel.com has moved to the notes/site Worker.

name = "theo-gallery"
compatibility_date = "2025-08-18"
workers_dev = true

[assets]
directory = "./dist"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

[[routes]]
pattern = "gallery.theoazriel.com"
custom_domain = true

# A legacy route, theoazriel.com/gallery*, still points at this Worker from
# the pre-subdomain era. It is not declared here: the deploy token has no
# zone permissions, so declaring it failed every deploy, and wrangler leaves
# undeclared routes alone. _redirects sends its traffic to the subdomain.